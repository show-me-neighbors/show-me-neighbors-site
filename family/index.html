<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your family account | Show-Me Neighbors</title>
<meta name="description" content="Make your Show-Me Neighbors family account and tell us about the person you are booking friendly visits for.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=1108a">
<link rel="icon" href="../assets/favicon.png" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
  body { background: #f5f8fc; }
  main { padding-block: 28px 70px; }
  .box { max-width: 1200px; margin: 0 auto; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; align-items: start; }
  .dash { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .stack > * + * { margin-top: 16px; }
  .stack .card, .cols .card, .dash .card, .people .card, .pgrid .card { margin-bottom: 0; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .hero-band { background: var(--ink); color: #fff; border-radius: 20px; padding: 26px 30px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
  .hero-band h1 { color: #fff; margin: 0; font-size: 2.1rem; }
  .hero-band p { margin: 4px 0 0; color: #c9d8ea; }
  .hero-band .pill { background: rgba(255,255,255,.12); border-radius: 14px; padding: 12px 16px; max-width: 520px; font-weight: 600; }
  .hero-band .pill strong { color: var(--sun); }
  .steps-mini { list-style: none; padding: 0; margin: 16px 0 0; }
  .steps-mini li { display: flex; gap: 12px; align-items: flex-start; margin: 12px 0; }
  .steps-mini b { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--sun); color: var(--ink); display: grid; place-items: center; font-weight: 900; }
  .section-h { margin: 0 0 12px; font-size: 1.35rem; }
  .card h2 { font-size: 1.35rem; }
  .person-card { display: flex; flex-direction: column; justify-content: space-between; min-height: 170px; }
  .add-tile { border: 2px dashed var(--line); border-radius: 18px; background: transparent; font: inherit; font-weight: 800; color: var(--brick); cursor: pointer; min-height: 170px; }
  .add-tile:hover { border-color: var(--brick); background: #fff; }
  .tabbar { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin: 0 0 22px; overflow-x: auto; }
  .tabbar button { font: inherit; font-weight: 800; font-size: 1rem; color: var(--ink-soft); background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 12px 18px; cursor: pointer; white-space: nowrap; }
  .tabbar button.on { color: var(--ink); border-color: var(--sun); }
  .tabbar button:hover { color: var(--ink); }
  .tabbody .card { padding: 22px 24px; }
  .tabbody .card p, .tabbody .card li, .tabbody .muted { font-size: 1rem; }
  .tabbody .small, .tabbody .muted.small { font-size: .9rem; }
  .headrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .headrow h1 { font-size: 2rem; margin: 0; }
  .soon { background: #fff4df; border-radius: 999px; padding: 10px 18px; font-size: .95rem; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .tile { display: flex; flex-direction: column; gap: 6px; margin: 0; }
  .tile .btn { align-self: flex-start; margin-top: 8px; }
  .tile-top { display: flex; gap: 14px; align-items: center; }
  .tile-top strong { font-size: 1.1rem; }
  .eyebrow { margin: 0; }
  .lrow { display: flex; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .lrow:last-child { border-bottom: 0; }
  .lmeta { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip.ok { background: #e3f1e6; color: #2e7d4f; }
  .subtabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .subtabs button { font: inherit; font-weight: 800; font-size: .95rem; padding: 9px 16px; border-radius: 999px; border: 2px solid var(--line); background: #fff; cursor: pointer; }
  .subtabs button.on { border-color: var(--brick); background: #e3edf6; }
  .subtabs button:disabled { opacity: .45; cursor: not-allowed; }
  .pane { margin: 0; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .grid-3 textarea { min-height: 150px; }
  .savebar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; }
  .savebar .msg { margin: 0; }
  .contacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .cols, .dash, .pgrid, .grid-3 { grid-template-columns: 1fr; } .tabbar button { padding: 10px 12px; } }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2 { margin-top: 0; }
  .muted { color: var(--ink-soft); }
  .msg { padding: 12px 14px; border-radius: 12px; margin-top: 12px; font-weight: 700; }
  .msg.ok { background: #e3f1e6; } .msg.err { background: #fbe4dd; color: #7a2a17; } .msg.info { background: #e3edf6; }
  .back { background: none; border: 0; font: inherit; font-weight: 800; color: var(--brick); cursor: pointer; padding: 0; margin-bottom: 10px; }
  .site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .toplinks { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: .95rem; }
  .toplinks a { color: var(--ink); text-decoration: none; }
  @media (max-width: 520px) { .toplinks > a { display: none; } }
  .person { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .initial { flex: 0 0 52px; height: 52px; border-radius: 50%; background: var(--sage-soft); color: var(--brick); display: grid; place-items: center; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 1.4rem; }
  .bar { height: 8px; border-radius: 99px; background: #e9eff6; overflow: hidden; margin: 8px 0 4px; max-width: 260px; }
  .bar span { display: block; height: 100%; background: var(--sun); }
  .who-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .who-row .tick { flex: 1 1 200px; }
  .contact { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .chip { display: inline-block; font-size: .75rem; font-weight: 900; border-radius: 99px; padding: 2px 9px; background: #e9eff6; margin-right: 4px; }
  .chip.red { background: #fbe4dd; color: #7a2a17; }
  .row { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; margin: 8px 0; }
  .row input { width: auto; margin-top: 4px; }
  .linkbtn { background: none; border: 0; font: inherit; font-weight: 800; color: var(--brick); cursor: pointer; padding: 0; }
  .linkbtn.red { color: #8a3a22; }
  textarea { min-height: 80px; }
  .sticky-save { position: sticky; bottom: 0; background: linear-gradient(transparent, #f5f8fc 30%); padding: 18px 0 8px; z-index: 2; }
  .sticky-save .btn { max-width: 360px; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../index.html" aria-label="Show-Me Neighbors home">
      <span class="brand-name" role="img" aria-label="Show-Me Neighbors"><span class="w1">Sh<svg class="hdot" viewBox="0 0 60.2 54" aria-hidden="true"><circle cx="30.1" cy="27" r="27" fill="#eb9d1c"/><path transform="translate(3.1 0) scale(.54)" d="M50 78 C30 64 20 54 20 41 C20 31 28 24 37 24 C43 24 47.5 27 50 31.5 C52.5 27 57 24 63 24 C72 24 80 31 80 41 C80 54 70 64 50 78 Z" fill="#fff"/></svg>w-Me</span> <span class="w2">Neighbors</span></span>

</header>
<main class="wrap"><div class="box" id="app"><p class="muted">Loading...</p></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var SB_URL = 'https://ubsupoboukcpbklvdkkq.supabase.co';
  var SB_KEY = 'sb_publishable_02PKeFgkiaetde-La-uBKA_M9hhAHvG'; // public browser key; the server checks everything
  var sb = supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: 'smn-family-auth' } }); // own sign-in, separate from the office and other pages
  var app = document.getElementById('app'), whoEl = document.getElementById('who');
  var data = null, view = 'home', editId = null, contactFor = null, contactId = null;
  var HELP = ['Company', 'Rides', 'Errands', 'Around the house', 'Meals', 'Tech help', 'Walks', 'Games and hobbies', 'Doctor appointments'];
  var PETS = ['Dog', 'Cat', 'Other'];

  function e(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  async function call(action, body) {
    try {
      var r = await sb.functions.invoke('families', { body: Object.assign({ action: action }, body || {}) });
      if (r.error) { var j = null; try { j = await r.error.context.json(); } catch (x) {} return j || { ok: false, error: 'We could not reach Show-Me Neighbors. Please check your connection and try again.' }; }
      return r.data;
    } catch (x) { return { ok: false, error: 'We could not reach Show-Me Neighbors. Please check your connection and try again.' }; }
  }
  function busy(b, t) { if (b) { b.disabled = true; b.dataset.was = b.textContent; b.textContent = t || 'One moment...'; } }
  function unbusy(b) { if (b) { b.disabled = false; b.textContent = b.dataset.was || b.textContent; } }
  function say(id, text, kind) { var el = document.getElementById(id); if (el) el.innerHTML = text ? '<div class="msg ' + (kind || 'err') + '">' + e(text) + '</div>' : ''; }
  function checks(name, opts, on) { on = on || []; return '<div>' + opts.map(function (o) { return '<label class="tick"><input type="checkbox" name="' + name + '" value="' + e(o) + '"' + (on.indexOf(o) >= 0 ? ' checked' : '') + '><span>' + e(o) + '</span></label>'; }).join('') + '</div>'; }
  function radios(name, opts, on) { return '<div>' + opts.map(function (o) { return '<label class="tick"><input type="radio" name="' + name + '" value="' + e(o) + '"' + (o === on ? ' checked' : '') + '><span>' + e(o) + '</span></label>'; }).join('') + '</div>'; }
  function person(id) { return data.people.filter(function (p) { return p.id === id; })[0]; }
  function nameOf(p) { return (p.preferred || p.first_name) + ' ' + p.last_name; }
  function filled(p) {
    var parts = [p.street && p.city, (p.help || []).length, p.interests, p.good_to_know, p.arrival, (p.contacts || []).some(function (c) { return c.emergency; })];
    var n = parts.filter(Boolean).length; return { n: n, of: parts.length, pct: Math.round(100 * n / parts.length) };
  }

  // ---------- not signed in ----------
  function signInBox(note) {
    return '<div class="card"><h2>Already have an account?</h2><p class="muted">Enter your email and we will send you a link to sign in. No password needed.</p>' +
      '<form id="lf"><div class="field"><label for="lf-em">Email</label><input id="lf-em" type="email" autocomplete="email" required></div><button class="btn btn-ghost">Email me a link</button></form><div id="lf-msg">' + (note || '') + '</div></div>';
  }
  function startScreen(note) {
    return '<div class="cols"><div class="stack"><div class="card"><h1 style="font-size:2.2rem;margin-top:0">Make your family account</h1><p>It is free and takes about 2 minutes. Then tell us a little about the person you are booking for, so their Neighbor can feel like a friend from the first hello.</p>' + (note || '') +
      '<ul class="steps-mini"><li><b>1</b><span><strong>Make your account.</strong> Just your name, email and ZIP code.</span></li><li><b>2</b><span><strong>Tell us about your loved one.</strong> What they enjoy, what would help, and who to call.</span></li><li><b>3</b><span><strong>Book visits when we open.</strong> We will email you the moment booking opens in your area.</span></li></ul></div>' + signInBox() + '</div>' +
      '<form id="sf" class="card" novalidate><h2 style="margin-top:0">Your details</h2><div style="position:absolute;left:-9999px" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>' +
      '<fieldset class="field ticks"><legend>Who are the visits for?</legend><div class="who-row"><label class="tick"><input type="radio" name="is_for" value="A loved one" checked><span>Someone I love</span></label><label class="tick"><input type="radio" name="is_for" value="Me"><span>Me</span></label></div></fieldset>' +
      '<div class="grid-2"><div class="field"><label for="s-first">Your first name</label><input id="s-first" autocomplete="given-name"></div><div class="field"><label for="s-last">Your last name</label><input id="s-last" autocomplete="family-name"></div></div>' +
      '<div class="grid-2" id="lo-names"><div class="field"><label for="s-pfirst">Their first name</label><input id="s-pfirst" placeholder="Like Dorothy"></div><div class="field"><label for="s-plast">Their last name</label><input id="s-plast"></div></div>' +
      '<div class="grid-2"><div class="field"><label for="s-email">Your email</label><input id="s-email" type="email" autocomplete="email"></div><div class="field"><label for="s-phone">Your mobile phone</label><input id="s-phone" type="tel" autocomplete="tel"></div></div>' +
      '<div class="grid-2"><div class="field"><label for="s-zip">ZIP code where the visits will be</label><input id="s-zip" inputmode="numeric" maxlength="5"></div>' +
      '<div class="field"><label for="s-heard">How did you hear about us?</label><select id="s-heard"><option value="">Choose one</option><option>Friend or family</option><option>Facebook or social media</option><option>Online search</option><option>Doctor, church or community group</option><option>Flyer or newspaper</option><option>Other</option></select></div></div>' +
      '<p class="form-consent">By making an account you agree Show-Me Neighbors may email and text you about your account and visits. Message and data rates may apply. See our <a href="../privacy.html">privacy policy</a>.</p>' +
      '<button class="btn btn-primary" style="width:100%">Make my account</button><div id="sf-msg"></div></form></div>';
  }

  // ---------- signed in: top tabs ----------
  var TABS = [['home', 'Home'], ['people', 'Loved ones'], ['pay', 'Payment'], ['me', 'Account']];
  var TAB_OF = { home: 'home', people: 'people', person: 'people', contact: 'people', pay: 'pay', card: 'pay', me: 'me' };
  var ptab = 'basics';
  function tabbar() {
    return '<nav class="tabbar" aria-label="Your account">' + TABS.map(function (t) { return '<button data-v="' + t[0] + '" class="' + (TAB_OF[view] === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</nav>';
  }
  function bookBtn() {
    return data.bookings_open ? '<button class="btn btn-primary" data-v="people">Book a visit</button>' : '<span class="soon"><strong>Booking opens soon.</strong> We will email you the day it opens.</span>';
  }
  function homeScreen(note) {
    var f = data.family, cd = f.card;
    var h = '<div class="headrow"><div><h1>Hi, ' + e(f.first_name) + '</h1><p class="muted" style="margin:2px 0 0">Here is everything for your family in one place.</p></div>' + bookBtn() + '</div>' + (note || '');
    h += '<div class="tiles">';
    data.people.forEach(function (p) {
      var fl = filled(p), init = (p.preferred || p.first_name || '?').charAt(0).toUpperCase();
      h += '<div class="card tile"><div class="tile-top"><div class="initial">' + e(init) + '</div><div><div class="eyebrow">Loved one</div><strong>' + e(nameOf(p)) + '</strong><div class="muted small">' + e([p.city, p.zip].filter(Boolean).join(', ')) + '</div></div></div>' +
        (p.area === 'Not yet served' ? '<span class="chip red">Not in our area yet</span>' : '') +
        '<div class="bar" aria-hidden="true"><span style="width:' + fl.pct + '%"></span></div><div class="muted small">Profile ' + (fl.pct < 100 ? fl.n + ' of ' + fl.of + ' parts done' : 'complete') + '</div>' +
        '<button class="btn ' + (fl.pct < 100 ? 'btn-primary' : 'btn-ghost') + ' btn-small" data-edit="' + p.id + '">' + (fl.pct < 100 ? 'Finish profile' : 'View profile') + '</button></div>';
    });
    h += '<div class="card tile"><div class="tile-top"><div class="initial" style="background:#fff4df;color:#a86a00">$</div><div><div class="eyebrow">Payment</div><strong>' + (cd ? e(cd.brand) + ' ending in ' + e(cd.last4) : 'No card yet') + '</strong><div class="muted small">' + (cd ? 'Expires ' + e(cd.exp) : 'You will not be charged now') + '</div></div></div>' +
      '<p class="small muted" style="margin:10px 0">We only charge after each visit is finished, for that visit.</p><button class="btn ' + (cd ? 'btn-ghost' : 'btn-primary') + ' btn-small" data-v="' + (cd ? 'pay' : 'card') + '">' + (cd ? 'Manage card' : 'Add a card') + '</button></div>';
    h += '<div class="card tile"><div class="tile-top"><div class="initial" style="background:#e3f1e6;color:#2e7d4f">?</div><div><div class="eyebrow">Questions</div><strong>We are here to help</strong><div class="muted small">A real person reads every message</div></div></div>' +
      '<p class="small" style="margin:10px 0">Email <strong>hello@showmeneighbors.com</strong></p><button class="btn btn-ghost btn-small" data-v="people">Add another loved one</button></div>';
    return h + '</div>';
  }
  function peopleScreen(note) {
    var h = '<div class="headrow"><div><h1>Loved ones</h1><p class="muted" style="margin:2px 0 0">The people you book visits for. Up to 6.</p></div>' + (data.people.length < 6 ? '<button class="btn btn-primary" data-edit="new">+ Add a loved one</button>' : '') + '</div>' + (note || '');
    h += '<div class="card" style="padding:6px 22px">' + data.people.map(function (p) {
      var fl = filled(p), em = (p.contacts || []).some(function (c) { return c.emergency; });

        '<div class="muted small">' + e([p.street, p.city, p.zip].filter(Boolean).join(', ')) + '</div></div>' +
        '<div class="lmeta small">' + (fl.pct < 100 ? '<span class="chip">Profile ' + fl.n + ' of ' + fl.of + '</span>' : '<span class="chip ok">Profile complete</span>') + (em ? '' : ' <span class="chip red">No emergency contact</span>') + '</div>' +
        '<button class="btn btn-ghost btn-small" data-edit="' + p.id + '">Open</button></div>';
    }).join('') + '</div>';
    return h;
  }
  var PTABS = [['basics', 'Basics'], ['help', 'Help and matching'], ['know', 'Good to know'], ['contacts', 'Contacts']];
  function personScreen(note) {
    var isNew = editId === 'new';
    var p = isNew ? { first_name: '', last_name: '', help: [], pets: [], gender_pref: 'No preference', contacts: [] } : person(editId);
    var they = p.is_self ? 'you' : (p.preferred || p.first_name || 'they');
    if (isNew && ptab === 'contacts') ptab = 'basics';
    var h = '<button class="back" data-v="people">&larr; Loved ones</button><div class="headrow"><div><h1>' + (isNew ? 'Add a loved one' : e(p.is_self ? 'About you' : nameOf(p))) + '</h1><p class="muted" style="margin:2px 0 0">Only you, our team and the Neighbor visiting can see this.</p></div></div>' + (note || '');
    h += '<nav class="subtabs">' + PTABS.map(function (t) { var off = isNew && t[0] === 'contacts'; return '<button data-ptab="' + t[0] + '" class="' + (ptab === t[0] ? 'on' : '') + '"' + (off ? ' disabled title="Save first"' : '') + '>' + t[1] + (t[0] === 'contacts' && !isNew ? ' (' + p.contacts.length + ')' : '') + '</button>'; }).join('') + '</nav>';
    var show = function (k) { return ptab === k ? '' : ' hidden'; };
    h += '<form id="pf" novalidate class="card pane">' +
      '<div data-pane="basics"' + show('basics') + '><div class="grid-2"><div class="field"><label for="p-first">First name</label><input id="p-first" value="' + e(p.first_name === 'Your loved one' ? '' : p.first_name) + '"></div><div class="field"><label for="p-last">Last name</label><input id="p-last" value="' + e(p.last_name) + '"></div></div>' +
      '<div class="grid-2"><div class="field"><label for="p-pref">Name ' + (p.is_self ? 'you go' : 'they go') + ' by (optional)</label><input id="p-pref" value="' + e(p.preferred || '') + '" placeholder="Like Dot or Mr. Jim"></div><div class="field"><label for="p-phone">' + (p.is_self ? 'Your' : 'Their') + ' phone (optional)</label><input id="p-phone" type="tel" value="' + e(p.phone || '') + '"></div></div>' +
      '<div class="grid-3"><div class="field" style="grid-column:span 1"><label for="p-street">Street address</label><input id="p-street" autocomplete="street-address" value="' + e(p.street || '') + '"></div><div class="field"><label for="p-city">City</label><input id="p-city" value="' + e(p.city || '') + '"></div><div class="field"><label for="p-zip">ZIP code</label><input id="p-zip" inputmode="numeric" maxlength="5" value="' + e(p.zip || '') + '"></div></div></div>' +
      '<div data-pane="help"' + show('help') + '><div class="grid-2"><div><fieldset class="field ticks"><legend>What would help most? Pick any.</legend>' + checks('help', HELP, p.help) + '</fieldset>' +
      '<p class="muted small" style="margin:6px 0 0">Neighbors offer friendly, everyday help. They never give personal care like bathing, dressing or help in the bathroom, never handle medicine, and never lift anyone.</p></div>' +
      '<div><fieldset class="field ticks"><legend>Would ' + e(they) + ' like a Neighbor who is...</legend>' + radios('gender_pref', ['No preference', 'A woman', 'A man'], p.gender_pref || 'No preference') + '</fieldset>' +
      '<fieldset class="field ticks"><legend>Any pets at home?</legend>' + checks('pets', PETS, p.pets) + '</fieldset>' +
      '<div class="field"><label for="p-petnotes">About the pets (optional)</label><input id="p-petnotes" value="' + e(p.pet_notes || '') + '" placeholder="Like a friendly old beagle named Max"></div></div></div></div>' +
      '<div data-pane="know"' + show('know') + '><div class="grid-3"><div class="field"><label for="p-int">What does ' + e(they) + ' enjoy?</label><textarea id="p-int" placeholder="Card games, gardening, old Westerns, the Cardinals, church, grandkids...">' + e(p.interests || '') + '</textarea></div>' +
      '<div class="field"><label for="p-know">Anything a visitor should know?</label><textarea id="p-know" placeholder="Hard of hearing on the left side, uses a walker, memory is not what it was...">' + e(p.good_to_know || '') + '</textarea></div>' +
      '<div class="field"><label for="p-arr">Getting there</label><textarea id="p-arr" placeholder="Park in the driveway, use the side door, knock loudly...">' + e(p.arrival || '') + '</textarea></div></div></div>' +
      '<div class="savebar"' + (ptab === 'contacts' ? ' hidden' : '') + '><button class="btn btn-primary">Save</button><span id="pf-msg"></span>' + (!isNew && !p.is_self && data.people.length > 1 ? '<button type="button" class="linkbtn red" data-del="' + p.id + '" style="margin-left:auto">Remove ' + e(nameOf(p)) + '</button>' : '') + '</div></form>';
    if (!isNew) {
      h += '<div class="card pane" data-pane="contacts"' + show('contacts') + '><div class="headrow" style="margin:0 0 6px"><p class="muted" style="margin:0">Who should we call in an emergency (after 911), and who would like visit notes and updates?</p><button class="btn btn-primary btn-small" data-cedit="new">+ Add a contact</button></div>' +
        (p.contacts.length ? '<div class="contacts">' + p.contacts.map(function (c) {
          return '<div class="contact"><div><strong>' + e(c.name) + '</strong>' + (c.relation ? ' <span class="muted">(' + e(c.relation) + ')</span>' : '') + '<br><span class="muted small">' + e([c.phone, c.email].filter(Boolean).join(' · ')) + '</span><br>' +
            (c.emergency ? '<span class="chip red">Emergency contact</span>' : '') + (c.gets_updates ? '<span class="chip">Gets visit updates</span>' : '') + '</div><div><button class="linkbtn" data-cedit="' + c.id + '">Edit</button></div></div>';
        }).join('') + '</div>' : '<p><strong>No contacts yet.</strong> Please add at least one emergency contact.</p>') + '</div>';
    }
    return h;
  }
  function payScreen(note) {
    var cd = data.family.card;
    return '<div class="headrow"><div><h1>Payment</h1><p class="muted" style="margin:2px 0 0">We only charge after each visit is finished, for that visit, and email you a receipt.</p></div></div>' + (note || '') +
      '<div class="grid-2" style="align-items:start"><div class="card"><div class="eyebrow">Card on file</div>' + (cd
        ? '<p style="font-size:1.2rem;margin:6px 0 2px"><strong>' + e(cd.brand) + ' ending in ' + e(cd.last4) + '</strong></p><p class="muted" style="margin:0 0 14px">Expires ' + e(cd.exp) + '</p><button class="btn btn-ghost btn-small" data-v="card">Use a different card</button> <button class="linkbtn red" style="margin-left:14px" data-cardrm="1">Remove</button>'
        : '<p style="margin:6px 0 14px">No card yet. <strong>You will not be charged now.</strong></p><button class="btn btn-primary btn-small" data-v="card">Add a card</button>') + '</div>' +
      '<div class="card"><div class="eyebrow">How paying works</div><ul class="steps-mini"><li><b>1</b><span>Save a card so you are ready to book.</span></li><li><b>2</b><span>After each visit, we charge the card for that visit only.</span></li><li><b>3</b><span>You get an email receipt every time.</span></li></ul><p class="muted small" style="margin:0">Your card is kept safely by Stripe. We never see or store your full card number.</p></div></div>';
  }
  function meScreen() {
    var f = data.family;
    return '<div class="headrow"><div><h1>Account</h1><p class="muted" style="margin:2px 0 0">Your own details, for us to reach you.</p></div></div><form id="mf" class="card">' +
      '<div class="grid-3"><div class="field"><label for="m-first">First name</label><input id="m-first" value="' + e(f.first_name) + '"></div><div class="field"><label for="m-last">Last name</label><input id="m-last" value="' + e(f.last_name) + '"></div><div class="field"><label for="m-phone">Mobile phone</label><input id="m-phone" type="tel" value="' + e(f.phone || '') + '"></div></div>' +
      '<p class="muted small">Your email is <strong>' + e(f.email) + '</strong>. To change it, reply to any of our emails.</p><div class="savebar"><button class="btn btn-primary">Save</button><span id="mf-msg"></span></div></form>';
  }
  function cardScreen() {
    return '<button class="back" data-v="pay">&larr; Payment</button><div class="headrow"><h1>Add a card</h1></div>' +
      '<div class="cols"><div class="card"><div id="pay-el" style="min-height:120px"><p class="muted">Loading the secure card form...</p></div>' +
      '<button class="btn btn-primary" id="card-save" style="width:100%;margin-top:16px" disabled>Save card</button><div id="card-msg"></div></div>' +
      '<div class="card"><h2 style="margin-top:0">You will not be charged now</h2><ul class="steps-mini"><li><b>1</b><span>Save a card so you are ready to book.</span></li><li><b>2</b><span>After each visit is finished, we charge this card for that visit only.</span></li><li><b>3</b><span>You get an email receipt every time. Change or remove the card any time.</span></li></ul>' +
      '<p class="muted" style="font-size:.9rem;margin-bottom:0">Your card is kept safely by Stripe, our payment company. Show-Me Neighbors never sees or stores your full card number.</p></div></div>';
  }
  var stripeJs = null, stripeEls = null;
  function loadStripeJs() {
    return new Promise(function (res, rej) {
      if (window.Stripe) return res();
      var sc = document.createElement('script'); sc.src = 'https://js.stripe.com/v3/'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
    });
  }
  async function mountCard() {
    var box = document.getElementById('pay-el'), btn = document.getElementById('card-save');
    var r = await call('card_start');
    if (!r || !r.ok || !r.client_secret || !r.stripe_pk) { box.innerHTML = '<div class="msg err">' + e((r && r.error) || 'We could not open the card form. Please try again in a minute.') + '</div>'; return; }
    try { await loadStripeJs(); } catch (x) { box.innerHTML = '<div class="msg err">We could not load the secure card form. Please check your connection and try again.</div>'; return; }
    stripeJs = window.Stripe(r.stripe_pk);
    stripeEls = stripeJs.elements({ clientSecret: r.client_secret, appearance: { theme: 'stripe', variables: { colorPrimary: '#376d93', colorText: '#13204b', fontFamily: 'Nunito Sans, Arial, sans-serif', borderRadius: '12px', fontSizeBase: '17px' } }, fonts: [{ cssSrc: 'https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap' }] });
    box.innerHTML = '';
    var el = stripeEls.create('payment', { layout: 'tabs', wallets: { applePay: 'never', googlePay: 'never' } });
    el.mount(box);
    el.on('ready', function () { btn.disabled = false; });
    btn.onclick = async function () {
      busy(btn, 'Saving...'); say('card-msg', '');
      var res = await stripeJs.confirmSetup({ elements: stripeEls, redirect: 'if_required', confirmParams: { return_url: location.origin + location.pathname } });
      if (res.error) { unbusy(btn); return say('card-msg', res.error.message || 'Your card was not saved. Please try again.'); }
      var d = await call('card_done', { setup_intent: res.setupIntent && res.setupIntent.id });
      unbusy(btn);
      if (!got(d, 'Card saved. You will not be charged until after a visit.', 'pay')) say('card-msg', (d && d.error) || 'Your card was not saved. Please try again.');
    };
  }
  function contactScreen() {
    var p = person(contactFor), c = contactId === 'new' ? { emergency: !p.contacts.some(function (x) { return x.emergency; }), gets_updates: true } : p.contacts.filter(function (x) { return x.id === contactId; })[0];
    return '<button class="back" data-v="person">&larr; ' + e(nameOf(p)) + '</button><div class="headrow"><h1>' + (contactId === 'new' ? 'Add a contact' : 'Edit contact') + '</h1></div><form id="cf" class="card" novalidate style="max-width:820px">' +
      '<div class="grid-2"><div class="field"><label for="c-name">Name</label><input id="c-name" value="' + e(c.name || '') + '"></div><div class="field"><label for="c-rel">How they are related</label><input id="c-rel" value="' + e(c.relation || '') + '" placeholder="Daughter, neighbor, friend..."></div></div>' +
      '<div class="grid-2"><div class="field"><label for="c-phone">Phone</label><input id="c-phone" type="tel" value="' + e(c.phone || '') + '"></div><div class="field"><label for="c-email">Email (optional)</label><input id="c-email" type="email" value="' + e(c.email || '') + '"></div></div>' +
      '<label class="row"><input type="checkbox" id="c-em"' + (c.emergency ? ' checked' : '') + '> <span><strong>Emergency contact.</strong> If something happens, the Neighbor calls 911 first, then us, and we call this person.</span></label>' +
      '<label class="row"><input type="checkbox" id="c-up"' + (c.gets_updates ? ' checked' : '') + '> <span><strong>Send them visit notes and updates.</strong></span></label>' +
      '<button class="btn btn-primary" style="margin-top:10px">Save contact</button>' + (contactId !== 'new' ? ' <button type="button" class="linkbtn red" style="margin-left:14px" data-cdel="' + c.id + '">Remove</button>' : '') + '<div id="cf-msg"></div></form>';
  }

  function render(note) {
    if (!data) { app.innerHTML = startScreen(note); prefill(); return toggleNames(); }
    var v = { home: homeScreen, people: peopleScreen, me: meScreen, person: personScreen, contact: contactScreen, pay: payScreen, card: cardScreen }[view] || homeScreen;
    app.innerHTML = tabbar() + '<div class="tabbody">' + v(note) + '</div>';
    window.scrollTo(0, 0);
    if (v === cardScreen) mountCard();
  }
  function prefill() { var z = new URLSearchParams(location.search).get('zip'), el = document.getElementById('s-zip'); if (el && z && /^\d{5}$/.test(z) && !el.value) el.value = z; }
  function toggleNames() { var r = app.querySelector('[name=is_for]:checked'), b = document.getElementById('lo-names'); if (b && r) b.hidden = r.value === 'Me'; }
  function header() {
    whoEl.innerHTML = data ? '<button class="btn btn-ghost btn-small" id="out" style="margin-left:10px">Sign out</button>' : '';
    var o = document.getElementById('out'); if (o) o.onclick = async function () { await sb.auth.signOut(); data = null; view = 'home'; header(); render(); };
  }
  function got(r, okNote, back) {
    if (!r || !r.ok) return false;
    data = r; if (back) view = back; header(); render(okNote ? '<div class="msg ok" style="margin:0 0 16px">' + e(okNote) + '</div>' : ''); return true;
  }

  async function start() {
    var t = new URLSearchParams(location.search).get('t');
    if (t) {
      history.replaceState(null, '', location.pathname);
      var v = await sb.auth.verifyOtp({ token_hash: t, type: 'email' });
      if (v.error) v = await sb.auth.verifyOtp({ token_hash: t, type: 'magiclink' });
      if (v.error) return render('<div class="msg err">That link has expired or was already used. Enter your email under "Already have an account?" and we will send a new one.</div>');
    }
    var s = (await sb.auth.getSession()).data.session;
    if (!s) return render();
    var r = await call('me');
    if (r && r.ok) {
      data = r; header();
      var first = data.people[0];
      if (first && filled(first).n === 0) { view = 'person'; editId = first.id; }
      return render();
    }
    if (r && r.none) { await sb.auth.signOut(); return render('<div class="msg err">' + e(r.error) + '. You can make an account below.</div>'); }
    render(r && !r.signin ? '<div class="msg err">' + e(r.error) + '</div>' : '');
  }

  app.addEventListener('change', function (ev) { if (ev.target.name === 'is_for') toggleNames(); });
  app.addEventListener('click', async function (ev) {
    var pt = ev.target.closest('[data-ptab]');
    if (pt) {
      ptab = pt.dataset.ptab;
      app.querySelectorAll('[data-ptab]').forEach(function (b) { b.classList.toggle('on', b.dataset.ptab === ptab); });
      app.querySelectorAll('[data-pane]').forEach(function (d) { d.hidden = d.dataset.pane !== ptab; });
      var sb = app.querySelector('.savebar'); if (sb) sb.hidden = ptab === 'contacts';
      var pf = document.getElementById('pf'); if (pf) pf.hidden = ptab === 'contacts';
      return;
    }
    var t = ev.target.closest('[data-v],[data-edit],[data-cedit],[data-del],[data-cdel],[data-cardrm]'); if (!t) return;
    if (t.dataset.cardrm) {
      if (t.dataset.sure !== '1') { t.dataset.sure = '1'; t.textContent = 'Click again to remove this card'; return; }
      busy(t, 'Removing...'); var rr = await call('card_remove');
      if (!got(rr, 'Card removed.', 'pay')) { unbusy(t); alertMsg(rr); }
      return;
    }
    if (t.dataset.v) { view = t.dataset.v; return render(); }
    if (t.dataset.edit) { editId = t.dataset.edit; view = 'person'; ptab = 'basics'; return render(); }
    if (t.dataset.cedit) { contactFor = editId; contactId = t.dataset.cedit; view = 'contact'; return render(); }
    if (t.dataset.del) {
      if (t.dataset.sure !== '1') { t.dataset.sure = '1'; t.textContent = 'Click again to remove them and their contacts'; return; }
      busy(t, 'Removing...'); var r = await call('delete_person', { id: t.dataset.del });
      if (!got(r, 'Removed.', 'people')) { unbusy(t); alertMsg(r); }
      return;
    }
    if (t.dataset.cdel) {
      if (t.dataset.sure !== '1') { t.dataset.sure = '1'; t.textContent = 'Click again to remove'; return; }
      busy(t, 'Removing...'); var r2 = await call('delete_contact', { id: t.dataset.cdel });
      ptab = 'contacts';
      if (!got(r2, 'Contact removed.', 'person')) { unbusy(t); say('cf-msg', (r2 && r2.error) || 'That did not work.'); }
    }
  });
  function alertMsg(r) { var d = document.createElement('div'); d.className = 'msg err'; d.textContent = (r && r.error) || 'That did not work. Please try again.'; app.prepend(d); }
  app.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var f = ev.target, btn = f.querySelector('button.btn-primary, button.btn');
    var g = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
    var all = function (n) { return Array.prototype.map.call(f.querySelectorAll('[name="' + n + '"]:checked'), function (c) { return c.value; }); };
    if (f.id === 'lf') {
      busy(btn, 'Sending...'); var r0 = await call('link', { email: g('lf-em') }); unbusy(btn);
      return say('lf-msg', r0 && r0.ok ? 'If we have an account for that email, a link is on its way. It works once and expires in an hour.' : ((r0 && r0.error) || 'That did not work. Please try again.'), r0 && r0.ok ? 'ok' : 'err');
    }
    if (f.id === 'sf') {
      var isFor = (f.querySelector('[name=is_for]:checked') || {}).value;
      var body = { is_for: isFor, first_name: g('s-first'), last_name: g('s-last'), person_first: g('s-pfirst'), person_last: g('s-plast'), email: g('s-email'), phone: g('s-phone'), zip: g('s-zip'), heard: g('s-heard'), website: f.website.value };
      var problem = !body.first_name || !body.last_name ? 'Please add your first and last name.' : (isFor !== 'Me' && !body.person_first) ? 'Please add the first name of the person the visits are for.' : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email) ? 'Please check your email address.' : !/^\d{5}$/.test(body.zip) ? 'Please add the 5-digit ZIP code where the visits will be.' : '';
      if (problem) return say('sf-msg', problem);
      busy(btn, 'Making your account...'); var r = await call('start', body); unbusy(btn);
      if (!r || !r.ok) return say('sf-msg', (r && r.error) || 'That did not work. Please try again.');
      app.innerHTML = '<div class="card"><h1 style="font-size:2rem;margin-top:0">' + (r.already ? 'Welcome back!' : 'Check your email') + '</h1><p>We sent a link to <strong>' + e(body.email) + '</strong>. Tap it to ' + (r.already ? 'sign in' : 'finish your profile') + '.</p>' +
        (r.area === 'Not yet served' ? '<p>We are not in ' + e(body.zip) + ' yet, but we are growing across Missouri. Your account is saved, and we will email you as soon as Neighbors are available near you.</p>' : '') +
        '<p class="muted">Do not see it? Check your spam or promotions folder. The email comes from hello@showmeneighbors.com.</p></div>';
      return window.scrollTo(0, 0);
    }
    if (f.id === 'mf') {
      busy(btn, 'Saving...'); var r1 = await call('save_family', { first_name: g('m-first'), last_name: g('m-last'), phone: g('m-phone') }); unbusy(btn);
      if (!got(r1, 'Saved.', 'me')) say('mf-msg', (r1 && r1.error) || 'That did not save. Please try again.');
      return;
    }
    if (f.id === 'pf') {
      var pb = { first_name: g('p-first'), last_name: g('p-last'), preferred: g('p-pref'), phone: g('p-phone'), street: g('p-street'), city: g('p-city'), zip: g('p-zip'), help: all('help'), gender_pref: (f.querySelector('[name=gender_pref]:checked') || {}).value, pets: all('pets'), pet_notes: g('p-petnotes'), interests: g('p-int'), good_to_know: g('p-know'), arrival: g('p-arr') };
      if (editId !== 'new') pb.id = editId;
      if (!pb.first_name || !pb.last_name) return say('pf-msg', 'Please add their first and last name.');
      if (!/^\d{5}$/.test(pb.zip)) return say('pf-msg', 'Please add the 5-digit ZIP code where the visits will be.');
      busy(btn, 'Saving...'); var r3 = await call('save_person', pb); unbusy(btn);
      if (!r3 || !r3.ok) return say('pf-msg', (r3 && r3.error) || 'That did not save. Please try again.');
      data = r3;
      if (editId === 'new') { editId = data.people[data.people.length - 1].id; }
      view = 'person'; render('<div class="msg ok" style="margin:0 0 16px">Saved.' + (person(editId).contacts.length ? '' : ' Next, open the Contacts tab and add an emergency contact.') + '</div>');
      return;
    }
    if (f.id === 'cf') {
      var cb = { loved_one_id: contactFor, name: g('c-name'), relation: g('c-rel'), phone: g('c-phone'), email: g('c-email'), emergency: document.getElementById('c-em').checked, gets_updates: document.getElementById('c-up').checked };
      if (contactId !== 'new') cb.id = contactId;
      if (!cb.name) return say('cf-msg', 'Please add their name.');
      if (!cb.phone && !cb.email) return say('cf-msg', 'Please add a phone number or email.');
      if (cb.emergency && !cb.phone) return say('cf-msg', 'An emergency contact needs a phone number.');
      busy(btn, 'Saving...'); var r4 = await call('save_contact', cb); unbusy(btn);
      ptab = 'contacts';
      if (!got(r4, 'Contact saved.', 'person')) say('cf-msg', (r4 && r4.error) || 'That did not save. Please try again.');
    }
  });
  start();
})();
</script>
</body>
</html>
