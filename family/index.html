  .toplinks { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: .95rem; }

  .person { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }

  .bar { height: 8px; border-radius: 99px; background: #e9eff6; overflow: hidden; margin: 8px 0 4px; max-width: 260px; }

  .row { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; margin: 8px 0; }

  .linkbtn { background: none; border: 0; font: inherit; font-weight: 800; color: var(--brick); cursor: pointer; padding: 0; }

<script>
  // Which marketing post sent them (?from=CODE on the link, or remembered from the home page for 30 days).
  function fromCode() {
    var q = (new URLSearchParams(location.search).get('from') || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 40);
    try { if (q) localStorage.setItem('smn-from', JSON.stringify({ c: q, t: Date.now() })); else { var o = JSON.parse(localStorage.getItem('smn-from') || 'null'); if (o && Date.now() - o.t < 30 * 864e5) q = o.c; } } catch (e) {}
    return q;
  }
  fromCode();
(function () {
  var SB_URL = 'https://ubsupoboukcpbklvdkkq.supabase.co';
  var SB_KEY = 'sb_publishable_02PKeFgkiaetde-La-uBKA_M9hhAHvG'; // public browser key; the server checks everything
  var sb = supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: 'smn-family-auth' } }); // own sign-in, separate from the office and other pages

      return r.data;

  function busy(b, t) { if (b) { b.disabled = true; b.dataset.was = b.textContent; b.textContent = t || 'One moment...'; } }

  function person(id) { return data.people.filter(function (p) { return p.id === id; })[0]; }

  function filled(p) {
    var parts = [p.street && p.city, (p.help || []).length, p.interests, p.good_to_know, p.arrival, (p.contacts || []).some(function (c) { return c.emergency; })];
    var n = parts.filter(Boolean).length; return { n: n, of: parts.length, pct: Math.round(100 * n / parts.length) };
  }

  // ---------- not signed in ----------
  function signInBox(note) {
    return '<div class="card"><h2>Already have an account?</h2><p class="muted">Enter your email and we will send you a link to sign in. No password needed.</p>' +
      '<form id="lf"><div class="field"><label for="lf-em">Email</label><input id="lf-em" type="email" autocomplete="email" required></div><button class="btn btn-ghost">Email me a link</button></form><div id="lf-msg">' + (note || '') + '</div></div>';
  }
  function startScreen(note) {
    return '<div class="cols"><div class="stack"><div class="card"><h1 style="font-size:2.2rem;margin-top:0">Make your family account</h1><p>It is free and takes about 2 minutes. Then tell us a little about the person you are booking for, so their Neighbor can feel like a friend from the first hello.</p>' + (note || '') +
      '<ul class="steps-mini"><li><b>1</b><span><strong>Make your account.</strong> Just your name, email and ZIP code.</span></li><li><b>2</b><span><strong>Tell us about your loved one.</strong> What they enjoy, what would help, and who to call.</span></li><li><b>3</b><span><strong>Book visits when we open.</strong> We will email you the moment booking opens in your area.</span></li></ul></div>' + signInBox() + '</div>' +
      '<form id="sf" class="card" novalidate><h2 style="margin-top:0">Your details</h2><div style="position:absolute;left:-9999px" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>' +
      '<fieldset class="field ticks"><legend>Who are the visits for?</legend><div class="who-row"><label class="tick"><input type="radio" name="is_for" value="A loved one" checked><span>Someone I love</span></label><label class="tick"><input type="radio" name="is_for" value="Me"><span>Me</span></label></div></fieldset>' +
      '<div class="grid-2"><div class="field"><label for="s-first">Your first name</label><input id="s-first" autocomplete="given-name"></div><div class="field"><label for="s-last">Your last name</label><input id="s-last" autocomplete="family-name"></div></div>' +
      '<div class="grid-2" id="lo-names"><div class="field"><label for="s-pfirst">Their first name</label><input id="s-pfirst" placeholder="Like Dorothy"></div><div class="field"><label for="s-plast">Their last name</label><input id="s-plast"></div></div>' +
      '<div class="grid-2"><div class="field"><label for="s-email">Your email</label><input id="s-email" type="email" autocomplete="email"></div><div class="field"><label for="s-phone">Your mobile phone</label><input id="s-phone" type="tel" autocomplete="tel"></div></div>' +
      '<div class="grid-2"><div class="field"><label for="s-zip">ZIP code where the visits will be</label><input id="s-zip" inputmode="numeric" maxlength="5"></div>' +
      '<div class="field"><label for="s-heard">How did you hear about us?</label><select id="s-heard"><option value="">Choose one</option><option>Friend or family</option><option>Facebook or social media</option><option>Online search</option><option>Doctor, church or community group</option><option>Flyer or newspaper</option><option>Other</option></select></div></div>' +
      '<p class="form-consent">By making an account you agree Show-Me Neighbors may email and text you about your account and visits. Message and data rates may apply. See our <a href="../privacy.html">privacy policy</a>.</p>' +
      '<button class="btn btn-primary" style="width:100%">Make my account</button><div id="sf-msg"></div></form></div>';
  }

  // ---------- signed in: top tabs ----------
  var TABS = [['home', 'Home'], ['visits', 'Visits'], ['people', 'Loved ones'], ['pay', 'Payment'], ['me', 'Account']];
  var TAB_OF = { home: 'home', visits: 'visits', book: 'visits', people: 'people', person: 'people', contact: 'people', pay: 'pay', card: 'pay', receipt: 'pay', statement: 'pay', me: 'me' };
  var ptab = 'basics';

  }
  function bookBtn() {
    return data.bookings_open ? '<button class="btn btn-primary" data-v="book">Book a visit</button>' : '<span class="soon"><strong>Booking opens soon.</strong> We will email you the day it opens.</span>';

  function homeScreen(note) {

    });
    h += '<div class="card tile"><div class="tile-top"><div class="initial" style="background:#fff4df;color:#a86a00">$</div><div><div class="eyebrow">Payment</div><strong>' + (cd ? e(cd.brand) + ' ending in ' + e(cd.last4) : 'No card yet') + '</strong><div class="muted small">' + (cd ? 'Expires ' + e(cd.exp) : 'You will not be charged now') + '</div></div></div>' +
      '<p class="small muted" style="margin:10px 0">We only charge after each visit is finished, for that visit.</p><button class="btn ' + (cd ? 'btn-ghost' : 'btn-primary') + ' btn-small" data-v="' + (cd ? 'pay' : 'card') + '">' + (cd ? 'Manage card' : 'Add a card') + '</button></div>';

  }

    if (f.id === 'lf') {
      busy(btn, 'Sending...'); var r0 = await call('link', { email: g('lf-em') }); unbusy(btn);
      return say('lf-msg', r0 && r0.ok ? 'If we have an account for that email, a link is on its way. It works once and expires in an hour.' : ((r0 && r0.error) || 'That did not work. Please try again.'), r0 && r0.ok ? 'ok' : 'err');
    }
    if (f.id === 'sf') {
      var isFor = (f.querySelector('[name=is_for]:checked') || {}).value;
      var body = { is_for: isFor, first_name: g('s-first'), last_name: g('s-last'), person_first: g('s-pfirst'), person_last: g('s-plast'), email: g('s-email'), phone: g('s-phone'), zip: g('s-zip'), heard: g('s-heard'), source: fromCode(), website: f.website.value };
      var problem = !body.first_name || !body.last_name ? 'Please add your first and last name.' : (isFor !== 'Me' && !body.person_first) ? 'Please add the first name of the person the visits are for.' : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email) ? 'Please check your email address.' : !/^\d{5}$/.test(body.zip) ? 'Please add the 5-digit ZIP code where the visits will be.' : '';
      if (problem) return say('sf-msg', problem);
      busy(btn, 'Making your account...'); var r = await call('start', body); unbusy(btn);
      if (!r || !r.ok) return say('sf-msg', (r && r.error) || 'That did not work. Please try again.');
      app.innerHTML = '<div class="card"><h1 style="font-size:2rem;margin-top:0">' + (r.already ? 'Welcome back!' : 'Check your email') + '</h1><p>We sent a link to <strong>' + e(body.email) + '</strong>. Tap it to ' + (r.already ? 'sign in' : 'finish your profile') + '.</p>' +
        (r.area === 'Not yet served' ? '<p>We are not in ' + e(body.zip) + ' yet, but we are growing across Missouri. Your account is saved, and we will email you as soon as Neighbors are available near you.</p>' : '') +
        '<p class="muted">Do not see it? Check your spam or promotions folder. The email comes from hello@showmeneighbors.com.</p></div>';
      return window.scrollTo(0, 0);
    }
    if (f.id === 'mf') {
      busy(btn, 'Saving...'); var r1 = await call('save_family', { first_name: g('m-first'), last_name: g('m-last'), phone: g('m-phone') }); unbusy(btn);
      if (!got(r1, 'Saved.', 'me')) say('mf-msg', (r1 && r1.error) || 'That did not save. Please try again.');
      return;
    }
    if (f.id === 'pf') {
      var pb = { first_name: g('p-first'), last_name: g('p-last'), preferred: g('p-pref'), phone: g('p-phone'), street: g('p-street'), city: g('p-city'), zip: g('p-zip'), help: all('help'), gender_pref: (f.querySelector('[name=gender_pref]:checked') || {}).value, pets: all('pets'), pet_notes: g('p-petnotes'), interests: g('p-int'), good_to_know: g('p-know'), arrival: g('p-arr') };
      if (editId !== 'new') pb.id = editId;
      if (!pb.first_name || !pb.last_name) return say('pf-msg', 'Please add their first and last name.');
      if (!/^\d{5}$/.test(pb.zip)) return say('pf-msg', 'Please add the 5-digit ZIP code where the visits will be.');
      busy(btn, 'Saving...'); var r3 = await call('save_person', pb); unbusy(btn);
      if (!r3 || !r3.ok) return say('pf-msg', (r3 && r3.error) || 'That did not save. Please try again.');
      data = r3;
      if (editId === 'new') { editId = data.people[data.people.length - 1].id; }
      view = 'person'; render('<div class="msg ok" style="margin:0 0 16px">Saved.' + (person(editId).contacts.length ? '' : ' Next, open the Contacts tab and add an emergency contact.') + '</div>');
      return;
    }
    if (f.id === 'cf') {
      var cb = { loved_one_id: contactFor, name: g('c-name'), relation: g('c-rel'), phone: g('c-phone'), email: g('c-email'), emergency: document.getElementById('c-em').checked, gets_updates: document.getElementById('c-up').checked };
      if (contactId !== 'new') cb.id = contactId;
      if (!cb.name) return say('cf-msg', 'Please add their name.');
      if (!cb.phone && !cb.email) return say('cf-msg', 'Please add a phone number or email.');
      if (cb.emergency && !cb.phone) return say('cf-msg', 'An emergency contact needs a phone number.');
      busy(btn, 'Saving...'); var r4 = await call('save_contact', cb); unbusy(btn);
      ptab = 'contacts';
      if (!got(r4, 'Contact saved.', 'person')) say('cf-msg', (r4 && r4.error) || 'That did not save. Please try again.');
    }
  });
  start();
})();
