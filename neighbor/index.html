<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Neighbor app | Show-Me Neighbors</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=1108a">
<link rel="icon" href="../assets/favicon.png" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
  body { background: #f5f8fc; }
  main { padding-block: 22px 70px; }
  .box { max-width: 1200px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow); }
  .card h2 { font-size: 1.3rem; margin: 0 0 8px; }
  .card p, .card li { font-size: 1rem; }
  .muted { color: var(--ink-soft); } .small { font-size: .9rem; }
  .msg { padding: 12px 14px; border-radius: 12px; margin: 0 0 14px; font-weight: 700; }
  .msg.ok { background: #e3f1e6; } .msg.err { background: #fbe4dd; color: #7a2a17; } .msg.info { background: #e3edf6; }
  .site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .toplinks { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: .95rem; }
  .tabbar { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin: 0 0 22px; overflow-x: auto; }
  .tabbar button { font: inherit; font-weight: 800; font-size: 1rem; color: var(--ink-soft); background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 12px 18px; cursor: pointer; white-space: nowrap; }
  .tabbar button.on { color: var(--ink); border-color: var(--sun); }
  .headrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .headrow h1 { font-size: 2rem; margin: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
  .switch { display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; }
  .switch .track { width: 62px; height: 34px; border-radius: 99px; background: #cfd8e3; position: relative; transition: background .15s; flex: 0 0 auto; }
  .switch .track::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .15s; }
  .switch input:checked + .track { background: #2e7d4f; } .switch input:checked + .track::after { left: 32px; }
  .switch input:disabled + .track { opacity: .5; }
  .switch input:focus-visible + .track { outline: 3px solid var(--brick); outline-offset: 2px; }
  .status-on { color: #2e7d4f; font-weight: 900; } .status-off { color: var(--ink-soft); font-weight: 900; }
  .week { width: 100%; border-collapse: collapse; }
  .week th, .week td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); }
  .week th:first-child, .week td:first-child { text-align: left; font-weight: 900; }
  .slot { font: inherit; font-weight: 800; font-size: .9rem; width: 100%; padding: 10px 6px; border-radius: 12px; border: 2px solid var(--line); background: #fff; cursor: pointer; }
  .slot.on { border-color: #2e7d4f; background: #e3f1e6; color: #1f5a37; }
  .range { width: 100%; }
  .pill { display: inline-block; background: #e9eff6; border-radius: 99px; padding: 3px 10px; font-weight: 800; font-size: .82rem; margin: 2px 4px 2px 0; }
  .savebar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; }
  .empty { border: 2px dashed var(--line); border-radius: 16px; padding: 22px; text-align: center; color: var(--ink-soft); }
  .linkbtn { background: none; border: 0; font: inherit; font-weight: 800; color: var(--brick); cursor: pointer; padding: 0; }
  .live { background: #e3f1e6; color: #1f5a37; border-radius: 99px; padding: 2px 10px; font-size: .8rem; font-weight: 900; }
  .finish { border-top: 1px solid var(--line); margin-top: 12px; }
  .offer { border: 2px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .vis { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; } .vis summary { cursor: pointer; }
  dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; } dl.kv dt { color: var(--ink-soft); } dl.kv dd { margin: 0; font-weight: 700; }
  .ds { display: none; }
  @media (max-width: 560px) { .dl { display: none; } .ds { display: inline; } .week th .small { display: none; } .toplinks .muted { display: none; } .week th { font-size: .82rem; } }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } .tabbar button { padding: 10px 12px; } .week th, .week td { padding: 6px 2px; } .slot { font-size: .8rem; padding: 9px 2px; } }
</style>
</head>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../index.html" aria-label="Show-Me Neighbors home">
      <span class="brand-name" role="img" aria-label="Show-Me Neighbors"><span class="w1">Sh<svg class="hdot" viewBox="0 0 60.2 54" aria-hidden="true"><circle cx="30.1" cy="27" r="27" fill="#eb9d1c"/><path transform="translate(3.1 0) scale(.54)" d="M50 78 C30 64 20 54 20 41 C20 31 28 24 37 24 C43 24 47.5 27 50 31.5 C52.5 27 57 24 63 24 C72 24 80 31 80 41 C80 54 70 64 50 78 Z" fill="#fff"/></svg>w-Me</span> <span class="w2">Neighbors</span></span>

    <div class="toplinks"><span class="muted">Neighbor app</span><span id="who"></span></div>
  </div>
</header>
<main class="wrap"><div class="box" id="app"><p class="muted">Loading...</p></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var SB_URL = 'https://ubsupoboukcpbklvdkkq.supabase.co';
  var SB_KEY = 'sb_publishable_02PKeFgkiaetde-La-uBKA_M9hhAHvG'; // public browser key; the server checks everything
  // Same sign-in as the Neighbor application, so applicants and Neighbors sign in once.
  var sb = supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: 'smn-apply-auth' } });
  var app = document.getElementById('app'), whoEl = document.getElementById('who');
  var me = null, a = null, view = 'home', draft = null;
  var HELP = ['Company', 'Rides', 'Errands', 'Around the house', 'Meals', 'Tech help', 'Walks', 'Games and hobbies', 'Doctor appointments'];
  var DAYS = [['Mon', 'Monday'], ['Tue', 'Tuesday'], ['Wed', 'Wednesday'], ['Thu', 'Thursday'], ['Fri', 'Friday'], ['Sat', 'Saturday'], ['Sun', 'Sunday']];
  var SLOTS = [['08:00-12:00', 'Morning', '8 to noon'], ['12:00-17:00', 'Afternoon', 'noon to 5'], ['17:00-20:00', 'Evening', '5 to 8']];
  var TABS = [['home', 'Home'], ['hours', 'My hours'], ['profile', 'My profile'], ['pay', 'Pay']];

  function e(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return '$' + (+n).toFixed(+n % 1 ? 2 : 0); }
  async function call(action, body) {
    try {
      var r = await sb.functions.invoke('neighbors', { body: Object.assign({ action: action }, body || {}) });
      if (r.error) { var j = null; try { j = await r.error.context.json(); } catch (x) {} return j || { ok: false, error: 'We could not reach Show-Me Neighbors. Please check your connection and try again.' }; }
      return r.data;
    } catch (x) { return { ok: false, error: 'We could not reach Show-Me Neighbors. Please check your connection and try again.' }; }
  }
  function busy(b, t) { if (b) { b.disabled = true; b.dataset.was = b.textContent; b.textContent = t || 'One moment...'; } }
  function unbusy(b) { if (b) { b.disabled = false; b.textContent = b.dataset.was || b.textContent; } }
  function say(id, text, kind) { var el = document.getElementById(id); if (el) el.innerHTML = text ? '<div class="msg ' + (kind || 'err') + '" style="margin:0">' + e(text) + '</div>' : ''; }
  function freeSummary(av) {
    var parts = DAYS.filter(function (d) { return (av[d[0]] || []).length; }).map(function (d) { return d[0] + ' ' + (av[d[0]] || []).map(function (r) { var s = SLOTS.filter(function (x) { return x[0] === r; })[0]; return s ? s[1].toLowerCase() : r; }).join(', '); });
    return parts.length ? parts.join(' · ') : 'No free times set yet';
  }

  // ---------- signed out ----------
  function signedOut(note) {
    app.innerHTML = '<div class="grid-2"><div class="card"><h1 style="font-size:2rem;margin-top:0">Neighbor app</h1><p>For approved Show-Me Neighbors. Set your free hours, get visit offers, and see your pay.</p><p class="muted">Not a Neighbor yet? <a href="../apply/">Apply here</a>.</p></div>' +
      '<div class="card"><h2>Sign in</h2><p class="muted">Enter the email you applied with and we will send you a sign-in link. No password needed.</p><form id="lf"><div class="field"><label for="lf-em">Email</label><input id="lf-em" type="email" autocomplete="email" required></div><button class="btn btn-primary">Email me a link</button></form><div id="lf-msg" style="margin-top:12px">' + (note || '') + '</div></div></div>';
  }

  // ---------- signed in ----------
  function tabbar() { return '<nav class="tabbar" aria-label="Neighbor app">' + TABS.map(function (t) { return '<button data-v="' + t[0] + '" class="' + (view === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</nav>'; }
  function home(note) {
    var on = a.taking_visits, setUp = Object.keys(a.availability).length > 0;
    var h = '<div class="headrow"><div><h1>Hi, ' + e(me.first) + '</h1><p class="muted" style="margin:2px 0 0">' + (a.approved ? 'You are an approved Show-Me Neighbor.' : 'You are almost there. Set up your hours now so you are ready the day you are approved.') + '</p></div></div>' + (note || '');
    h += '<div class="tiles"><div class="card"><h2>Taking visits</h2>' +
      '<label class="switch"><input type="checkbox" id="onoff"' + (on ? ' checked' : '') + (a.approved ? '' : ' disabled') + '><span class="track" aria-hidden="true"></span><span class="' + (on ? 'status-on' : 'status-off') + '">' + (on ? 'On. We will text you visit offers.' : 'Off. You will not get offers.') + '</span></label>' +
      '<p class="small muted" style="margin:12px 0 0">' + (a.approved ? (setUp ? 'Turn it off any time you need a break.' : 'Set your free times in My hours first.') : 'This turns on once you are approved.') + '</p><div id="onoff-msg" style="margin-top:8px"></div></div>' +
      '<div class="card"><h2>When you are free</h2><p class="small" style="margin:0 0 10px">' + e(freeSummary(a.availability)) + '</p><p class="small muted" style="margin:0 0 12px">Up to ' + e(a.radius_miles) + ' miles from ' + e(me.zip) + '</p><button class="btn ' + (setUp ? 'btn-ghost' : 'btn-primary') + ' btn-small" data-v="hours">' + (setUp ? 'Change my hours' : 'Set my hours') + '</button></div>' +
      '<div class="card"><h2>Your pay</h2><p class="small" style="margin:0 0 6px"><strong>' + money(a.pay_day) + ' an hour</strong> weekdays, <strong>' + money(a.pay_eve) + '</strong> evenings and weekends</p><p class="small" style="margin:0 0 6px">Mileage at the IRS rate, 100% yours</p><p class="small muted" style="margin:0 0 12px">Paid every Friday to your bank</p><button class="btn btn-ghost btn-small" data-v="pay">See pay details</button></div></div>';
    h += '<div class="grid-2" style="margin-top:18px"><div class="card"><h2>Visit offers</h2><div id="offers"><p class="muted small">Checking for offers...</p></div></div>' +
      '<div class="card"><h2>Your upcoming visits</h2><div id="upcoming"><p class="muted small">Loading...</p></div></div></div>';
    return h;
  }
  function hours(note) {
    var av = draft.availability;
    var h = '<div class="headrow"><div><h1>My hours</h1><p class="muted" style="margin:2px 0 0">Tap the times you are usually free. You will only get offers during these times. Change it any time.</p></div></div>' + (note || '');
    h += '<div class="grid-2"><div class="card" style="overflow-x:auto"><table class="week"><thead><tr><th></th>' + SLOTS.map(function (s) { return '<th>' + s[1] + '<div class="small muted" style="font-weight:600">' + s[2] + '</div></th>'; }).join('') + '</tr></thead><tbody>' +
      DAYS.map(function (d) { return '<tr><td><span class="dl">' + d[1] + '</span><span class="ds">' + d[0] + '</span></td>' + SLOTS.map(function (s) { var on = (av[d[0]] || []).indexOf(s[0]) >= 0; return '<td><button class="slot' + (on ? ' on' : '') + '" data-slot="' + d[0] + '|' + s[0] + '" aria-pressed="' + on + '">' + (on ? 'Free' : '-') + '</button></td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="card"><h2>How far will you drive?</h2><p class="small muted" style="margin:0 0 10px">From your home ZIP code, ' + e(me.zip) + '. You only get offers inside this distance. Your drive to and from a visit is not paid, so pick what feels right.</p>' +
      '<input type="range" class="range" id="radius" min="2" max="40" step="1" value="' + e(draft.radius_miles) + '"><p style="font-size:1.3rem;margin:6px 0 0"><strong id="radius-out">' + e(draft.radius_miles) + ' miles</strong></p></div></div>' +
      '<div class="savebar"><button class="btn btn-primary" data-save="1">Save my hours</button><span id="save-msg"></span></div>';
    return h;
  }
  function checks(name, opts, on) { return '<div>' + opts.map(function (o) { return '<label class="tick"><input type="checkbox" name="' + name + '" value="' + e(o) + '"' + (on.indexOf(o) >= 0 ? ' checked' : '') + '><span>' + e(o) + '</span></label>'; }).join('') + '</div>'; }
  function profile(note) {
    var h = '<div class="headrow"><div><h1>My profile</h1><p class="muted" style="margin:2px 0 0">Families see your first name, last initial and your few sentences below before you visit.</p></div></div>' + (note || '');
    h += '<div class="grid-2"><div class="card"><h2>About you</h2><div class="field"><label for="bio">A few friendly sentences for families</label><textarea id="bio" rows="5" maxlength="600" placeholder="Retired teacher who loves card games, gardening and a good story. Happy to drive to appointments and run errands.">' + e(draft.bio) + '</textarea></div>' +
      '<fieldset class="field ticks"><legend>Kinds of help you are glad to give</legend>' + checks('help_ok', HELP, draft.help_ok) + '</fieldset>' +
      '<fieldset class="field ticks"><legend>Allergic to any pets? We will never send you to homes with them.</legend>' + checks('pet_allergies', ['Dogs', 'Cats'], draft.pet_allergies) + '</fieldset></div>' +
      '<div class="card"><h2>Your details</h2><dl class="kv"><dt>Name</dt><dd>' + e(a.name) + '</dd><dt>Email</dt><dd>' + e(a.email) + '</dd><dt>Phone</dt><dd>' + e(a.phone || '') + '</dd><dt>Home ZIP</dt><dd>' + e(me.zip) + '</dd></dl>' +
      '<p class="small muted" style="margin:14px 0 0">To change these, reply to any of our emails or write to hello@showmeneighbors.com.</p></div></div>' +
      '<div class="savebar"><button class="btn btn-primary" data-save="1">Save my profile</button><span id="save-msg"></span></div>';
    return h;
  }
  function pay() {
    var cp = a.check_cost > 0;
    return '<div class="headrow"><div><h1>Pay</h1><p class="muted" style="margin:2px 0 0">How you are paid as a Show-Me Neighbor.</p></div></div>' +
      '<div class="tiles"><div class="card"><h2>For each visit</h2><p style="margin:0 0 6px"><strong>' + money(a.pay_day) + ' an hour</strong> on weekdays, 8 am to 6 pm</p><p style="margin:0 0 6px"><strong>' + money(a.pay_eve) + ' an hour</strong> on evenings and weekends</p><p class="small muted" style="margin:0">You see the pay for each visit before you accept it.</p></div>' +
      '<div class="card"><h2>Mileage</h2><p style="margin:0 0 6px">Miles you drive for rides and errands <strong>during a visit</strong> are paid at the full IRS rate' + (a.mile_rate ? ' (' + money(a.mile_rate) + ' a mile)' : '') + '.</p><p style="margin:0"><strong>100% is yours.</strong> Show-Me Neighbors keeps none of it. Your drive to and from a visit is not paid.</p></div>' +
      '<div class="card"><h2>Payday</h2><p style="margin:0 0 6px">Every <strong>Friday</strong>, straight to your bank through Stripe.</p><p class="small muted" style="margin:0">Bank account: <strong>' + e(me.bank_status || 'Not added') + '</strong>' + (me.bank_status === 'Added' ? '' : '. <a href="../apply/">Add it here</a>.') + '</p></div>' +
      (cp ? '<div class="card"><h2>Your background check</h2><p style="margin:0">We paid for it up front. ' + money(a.check_per_visit) + ' comes out of each of your first visits until ' + money(a.check_cost) + ' is covered, and we pay it all back after your ' + e(a.check_refund_after) + 'th visit.</p></div>' : '') +
      '<div class="card"><h2>No tipping</h2><p style="margin:0">Show-Me Neighbors is a no-tipping service. Please kindly say no to tips, cash or gifts, beyond a small thank-you treat.</p></div></div>' +
      '<div class="card" style="margin-top:18px"><h2>Your visits and pay</h2><div id="earn"><p class="muted small">Loading...</p></div></div>';
  }
  // ---------- offers and visits ----------
  async function callV(action, body) {
    try {
      var r = await sb.functions.invoke('visits', { body: Object.assign({ action: action }, body || {}) });
      if (r.error) { var j = null; try { j = await r.error.context.json(); } catch (x) {} return j || { ok: false, error: 'We could not reach Show-Me Neighbors. Please try again.' }; }
      return r.data;
    } catch (x) { return { ok: false, error: 'We could not reach Show-Me Neighbors. Please try again.' }; }
  }
  var work = null;
  function dLong(iso) { return new Date(iso).toLocaleDateString('en-US', { timeZone: 'America/Chicago', weekday: 'long', month: 'long', day: 'numeric' }); }
  function tShort(iso) { return new Date(iso).toLocaleTimeString('en-US', { timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit' }); }
  function when(v) { return dLong(v.start_at) + ', ' + tShort(v.start_at) + ' to ' + tShort(v.end_at); }
  async function loadWork() { var r = await callV('offers'); work = r && r.ok ? r : null; drawWork(r && !r.ok ? r.error : ''); }
  function drawWork(err) {
    var o = document.getElementById('offers'), u = document.getElementById('upcoming'); if (!o || !u) return;
    if (!work) { o.innerHTML = u.innerHTML = '<div class="msg err">' + e(err || 'Could not load.') + '</div>'; return; }
    o.innerHTML = work.offers.length ? work.offers.map(function (x) {
      return '<div class="offer"><strong>' + e(when(x)) + '</strong><div class="small">' + e(x.first_name) + ' in ' + e(x.city) + ', ' + e(x.miles) + ' miles from you</div><div class="small">Help: ' + e((x.help || []).join(', ') || 'Company') + (x.pets && x.pets.length ? ' · Pets: ' + e(x.pets.join(', ')) : '') + '</div>' +
        '<div class="small" style="margin:4px 0 8px"><strong>You earn ' + money(x.pay) + '</strong> (' + x.hours + ' hr at ' + money(x.pay_rate) + ') plus 100% of mileage</div><button class="btn btn-primary btn-small" data-accept="' + x.offer_id + '">Accept</button> <button class="linkbtn" style="margin-left:12px" data-decline="' + x.offer_id + '">No thanks</button><div class="omsg"></div></div>';
    }).join('') : '<div class="empty">No offers right now. When a family near you books during your free hours, we send you an offer. The first Neighbor to accept gets the visit.</div>';
    u.innerHTML = work.visits.length ? work.visits.map(function (v) {
      return '<details class="vis"' + (v.status === 'In progress' || soon(v) ? ' open' : '') + '><summary>' + (v.status === 'In progress' ? '<span class="live">Happening now</span> ' : '') + '<strong>' + e(when(v)) + '</strong><span class="small"> with ' + e(v.name) + '</span></summary><dl class="kv" style="margin-top:10px"><dt>Address</dt><dd>' + e(v.address) + '</dd>' + (v.phone ? '<dt>Their phone</dt><dd>' + e(v.phone) + '</dd>' : '') +
        '<dt>Help</dt><dd>' + e((v.help || []).join(', ') || 'Company') + '</dd>' + (v.family_notes ? '<dt>For this visit</dt><dd>' + e(v.family_notes) + '</dd>' : '') + (v.arrival ? '<dt>Getting there</dt><dd>' + e(v.arrival) + '</dd>' : '') +
        (v.good_to_know ? '<dt>Good to know</dt><dd>' + e(v.good_to_know) + '</dd>' : '') + (v.interests ? '<dt>Enjoys</dt><dd>' + e(v.interests) + '</dd>' : '') + (v.pets && v.pets.length ? '<dt>Pets</dt><dd>' + e(v.pets.join(', ') + (v.pet_notes ? ' (' + v.pet_notes + ')' : '')) + '</dd>' : '') +
        '<dt>Emergency</dt><dd>Call 911 first. Then ' + (v.emergency.length ? v.emergency.map(function (c) { return e(c.name + (c.relation ? ' (' + c.relation + ')' : '') + ' ' + (c.phone || '')); }).join(', ') : 'the on-call line') + '</dd><dt>You earn</dt><dd>' + money(v.pay) + ' plus 100% of mileage</dd></dl>' +
        visitActions(v) + '<div class="omsg"></div></details>';
    }).join('') : '<div class="empty">No visits yet. Visits you accept show up here, with the address, the family\'s notes and how to get in.</div>';
  }
  var earn = null;
  async function loadEarn() {
    var r = await callV('earnings'); earn = r && r.ok ? r : null;
    var box = document.getElementById('earn'); if (!box) return;
    if (!earn) { box.innerHTML = '<div class="msg err">' + e((r && r.error) || 'Could not load your pay.') + '</div>'; return; }
    if (!earn.rows.length) { box.innerHTML = '<div class="empty">Each finished visit shows here with the hours, miles and what you earned. You get a 1099 from Stripe each year.</div>'; return; }
    var y = String(new Date().getFullYear()), yr = earn.rows.filter(function (x) { return x.date.slice(0, 4) === y; }).reduce(function (s2, x) { return s2 + x.total; }, 0);
    box.innerHTML = '<p style="margin:0 0 10px"><strong>' + money(yr) + '</strong> earned in ' + y + ' from ' + earn.rows.length + ' visit' + (earn.rows.length === 1 ? '' : 's') + '.</p><div style="overflow-x:auto"><table class="week" style="font-size:.92rem"><thead><tr><th style="text-align:left">Date</th><th style="text-align:left">Visit</th><th>Hours</th><th>Pay</th><th>Miles</th><th>Check</th><th>Total</th></tr></thead><tbody>' +
      earn.rows.map(function (x) { return '<tr><td style="text-align:left;font-weight:600">' + e(new Date(x.date).toLocaleDateString('en-US', { timeZone: 'America/Chicago', month: 'short', day: 'numeric' })) + '</td><td style="text-align:left;font-weight:600">' + e(x.who) + (x.late_cancel ? ' <span class="pill">late cancel</span>' : '') + '</td><td>' + x.hours + '</td><td>' + money(x.pay) + '</td><td>' + (x.miles ? money(x.miles) : '-') + '</td><td>' + (x.refund ? '+' + money(x.refund) : x.deduct ? '-' + money(x.deduct) : '-') + '</td><td><strong>' + money(x.total) + '</strong>' + (x.paid ? '' : '<div class="small muted">waiting on the family\'s card</div>') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  function soon(v) { var t = new Date(v.start_at).getTime() - Date.now(); return t < 30 * 60e3 && new Date(v.end_at).getTime() > Date.now(); }
  function visitActions(v) {
    if (v.status === 'In progress') {
      return '<form class="finish" data-finish="' + v.id + '"><h3 style="margin:14px 0 6px">Finish the visit</h3>' +
        '<div class="field"><label for="mi-' + v.id + '">Miles you drove during the visit for rides and errands</label><input id="mi-' + v.id + '" type="number" inputmode="decimal" min="0" max="150" step="0.1" value="0"><div class="small muted">Do not count your drive to or from the home. Paid to you at ' + money(v.mile_rate || a.mile_rate || 0.76) + ' a mile, 100% yours.</div></div>' +
        '<div class="field"><label for="nt-' + v.id + '">Note for the family</label><textarea id="nt-' + v.id + '" rows="3" placeholder="We played two games of rummy, picked up her prescription and had lunch. She was in great spirits!"></textarea></div>' +
        '<button class="btn btn-primary">Finish visit</button></form>';
    }
    var can = soon(v);
    return '<div style="margin-top:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><button class="btn btn-primary btn-small" data-clockin="' + v.id + '"' + (can ? '' : ' disabled title="Opens 30 minutes before the visit"') + '>I am here, start the visit</button>' +
      (can ? '' : '<span class="small muted">Opens 30 minutes before</span>') + '<button class="linkbtn red" data-ncancel="' + v.id + '">I can no longer make this visit</button></div>';
  }
  // Where the phone is right now, only at check in and check out. If they say no, the visit still works.
  function where() {
    return new Promise(function (res) {
      if (!navigator.geolocation) return res({});
      var done = false, to = setTimeout(function () { if (!done) { done = true; res({}); } }, 9000);
      navigator.geolocation.getCurrentPosition(function (p) { if (done) return; done = true; clearTimeout(to); res({ lat: p.coords.latitude, lon: p.coords.longitude }); }, function () { if (done) return; done = true; clearTimeout(to); res({}); }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
    });
  }
  function render(note) {
    if (!me) return;
    var v = { home: home, hours: hours, profile: profile, pay: pay }[view] || home;
    app.innerHTML = tabbar() + v(note);
    window.scrollTo(0, 0);
    if (v === home) { if (work) drawWork(); loadWork(); }
    if (v === pay) loadEarn();
  }
  function header() {
    whoEl.innerHTML = me ? '<button class="btn btn-ghost btn-small" id="out">Sign out</button>' : '';
    var o = document.getElementById('out'); if (o) o.onclick = async function () { await sb.auth.signOut(); me = null; signedOut('<div class="msg ok" style="margin:0">You are signed out.</div>'); header(); };
  }
  function setMe(m) { me = m; a = m.app; draft = JSON.parse(JSON.stringify({ availability: a.availability, radius_miles: a.radius_miles, bio: a.bio, help_ok: a.help_ok, pet_allergies: a.pet_allergies })); }
  async function save(btn, extra) {
    var body = Object.assign({ availability: draft.availability, radius_miles: draft.radius_miles, bio: draft.bio, help_ok: draft.help_ok, pet_allergies: draft.pet_allergies, taking_visits: a.taking_visits }, extra || {});
    busy(btn, 'Saving...');
    var r = await call('save_app', body);
    unbusy(btn);
    if (!r || !r.ok) return { ok: false, error: (r && r.error) || 'That did not save. Please try again.' };
    setMe(r.me); return { ok: true };
  }

  async function start() {
    var t = new URLSearchParams(location.search).get('t');
    if (t) {
      history.replaceState(null, '', location.pathname);
      var v = await sb.auth.verifyOtp({ token_hash: t, type: 'email' });
      if (v.error) v = await sb.auth.verifyOtp({ token_hash: t, type: 'magiclink' });
      if (v.error) return signedOut('<div class="msg err" style="margin:0">That link has expired or was already used. Enter your email and we will send a new one.</div>');
    }
    var s = (await sb.auth.getSession()).data.session;
    if (!s) return signedOut();
    var r = await call('me');
    if (r && r.ok && r.me.app) { setMe(r.me); header(); return render(); }
    if (r && r.ok) { app.innerHTML = '<div class="card"><h1 style="font-size:2rem;margin-top:0">Not quite yet</h1><p>The Neighbor app opens after your video interview. You can see where your application stands here:</p><a class="btn btn-primary" href="../apply/">See my application</a></div>'; me = null; return; }
    if (r && r.none) { await sb.auth.signOut(); return signedOut('<div class="msg err" style="margin:0">' + e(r.error) + '</div>'); }
    signedOut(r && !r.signin ? '<div class="msg err" style="margin:0">' + e(r.error) + '</div>' : '');
  }

  app.addEventListener('click', async function (ev) {
    var ci = ev.target.closest('[data-clockin]');
    if (ci) {
      busy(ci, 'Checking in...'); var loc = await where();
      var rr = await callV('clock_in', Object.assign({ id: ci.dataset.clockin }, loc));
      if (rr && rr.ok) return render('<div class="msg ok">You are checked in. Enjoy the visit! When you are done, finish it below.</div>');
      unbusy(ci); var bx = ci.closest('details').querySelector('.omsg'); bx.innerHTML = '<div class="msg err" style="margin:8px 0 0">' + e((rr && rr.error) || 'That did not work.') + '</div>'; return;
    }
    var w = ev.target.closest('[data-accept],[data-decline],[data-ncancel]');
    if (w) {
      var box = w.parentNode.querySelector('.omsg');
      if (w.dataset.accept) { busy(w, 'Accepting...'); var r = await callV('accept', { offer_id: w.dataset.accept }); if (r && r.ok) { work = null; return render('<div class="msg ok">The visit is yours! The address and details are under Your upcoming visits.</div>'); } unbusy(w); box.innerHTML = '<div class="msg err" style="margin:8px 0 0">' + e((r && r.error) || 'That did not work.') + '</div>'; return loadWork(); }
      if (w.dataset.decline) { busy(w, '...'); await callV('decline', { offer_id: w.dataset.decline }); return loadWork(); }
      if (w.dataset.ncancel) {
        if (w.dataset.sure !== '1') { w.dataset.sure = '1'; w.textContent = 'The family is counting on you. Click again to give this visit back. We will find another Neighbor.'; return; }
        busy(w, 'Giving it back...'); var r2 = await callV('cancel_visit', { id: w.dataset.ncancel });
        if (r2 && r2.ok) return render('<div class="msg ok">Thanks for letting us know. We are already asking other Neighbors.</div>');
        unbusy(w); box.innerHTML = '<div class="msg err" style="margin:8px 0 0">' + e((r2 && r2.error) || 'That did not work.') + '</div>'; return;
      }
    }
    var t = ev.target.closest('[data-v],[data-slot],[data-save]'); if (!t) return;
    if (t.dataset.v) { view = t.dataset.v; return render(); }
    if (t.dataset.slot) {
      var p = t.dataset.slot.split('|'), list = draft.availability[p[0]] || [], i = list.indexOf(p[1]);
      if (i >= 0) list.splice(i, 1); else list.push(p[1]);
      list.sort(); if (list.length) draft.availability[p[0]] = list; else delete draft.availability[p[0]];
      var on = i < 0; t.classList.toggle('on', on); t.textContent = on ? 'Free' : '-'; t.setAttribute('aria-pressed', on);
      return;
    }
    if (t.dataset.save) {
      if (view === 'profile') {
        draft.bio = document.getElementById('bio').value.trim();
        draft.help_ok = Array.prototype.map.call(app.querySelectorAll('[name=help_ok]:checked'), function (c) { return c.value; });
        draft.pet_allergies = Array.prototype.map.call(app.querySelectorAll('[name=pet_allergies]:checked'), function (c) { return c.value; });
      }
      var res = await save(t, view === 'hours' && !Object.keys(draft.availability).length ? { taking_visits: false } : {});
      if (!res.ok) return say('save-msg', res.error);
      render('<div class="msg ok">Saved.</div>');
    }
  });
  app.addEventListener('input', function (ev) { if (ev.target.id === 'radius') { draft.radius_miles = +ev.target.value; document.getElementById('radius-out').textContent = ev.target.value + ' miles'; } });
  app.addEventListener('change', async function (ev) {
    if (ev.target.id !== 'onoff') return;
    var want = ev.target.checked; ev.target.disabled = true;
    var r = await call('save_app', { availability: a.availability, radius_miles: a.radius_miles, bio: a.bio, help_ok: a.help_ok, pet_allergies: a.pet_allergies, taking_visits: want });
    if (r && r.ok) { setMe(r.me); return render('<div class="msg ok">' + (want ? 'You are taking visits. We will text you offers.' : 'Visits are off. Turn them back on any time.') + '</div>'); }
    ev.target.checked = !want; ev.target.disabled = false; say('onoff-msg', (r && r.error) || 'That did not work. Please try again.');
  });
  app.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (ev.target.dataset.finish) {
      var id = ev.target.dataset.finish, b = ev.target.querySelector('button'), mi = +document.getElementById('mi-' + id).value || 0, nt = document.getElementById('nt-' + id).value.trim(), bx = ev.target.closest('details').querySelector('.omsg');
      if (nt.length < 15) { bx.innerHTML = '<div class="msg err" style="margin:8px 0 0">Please write a short note for the family (a sentence or two).</div>'; return; }
      busy(b, 'Finishing...'); var loc = await where();
      var r = await callV('clock_out', Object.assign({ id: id, miles: mi, note: nt }, loc));
      if (r && r.ok) { work = null; earn = null; return render('<div class="msg ok">Thank you! Visit finished. You earned ' + money(r.earned) + ', paid to your bank on Friday. Your note was sent to the family.</div>'); }
      unbusy(b); bx.innerHTML = '<div class="msg err" style="margin:8px 0 0">' + e((r && r.error) || 'That did not work.') + '</div>'; return;
    }
    if (ev.target.id !== 'lf') return;
    var btn = ev.target.querySelector('button'); busy(btn, 'Sending...');
    var r = await call('link', { email: document.getElementById('lf-em').value.trim() });
    unbusy(btn);
    say('lf-msg', r && r.ok ? 'If we have a Neighbor account for that email, a link is on its way. It works once and expires in an hour.' : ((r && r.error) || 'That did not work. Please try again.'), r && r.ok ? 'ok' : 'err');
  });
  start();
})();
</script>
</body>
</html>
