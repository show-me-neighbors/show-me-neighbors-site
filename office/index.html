      text: 'Senior Companion and Driver (Flexible, Part-Time)\nShow-Me Neighbors | Springfield, Branson and Table Rock Lake, and St. Charles County, Missouri\nPay: $18 to $21 an hour, paid after every visit, plus mileage\n\nAbout Show-Me Neighbors\nShow-Me Neighbors connects kind, dependable local people with older adults who would love some company, a ride or a hand with errands. Families book visits through our app, and our Neighbors choose the visits that fit their week. For a lot of the people we serve, a Neighbor\'s visit is the best part of the week.\n\nAbout the role\nAs a Neighbor, you are a friendly visitor, a driver and an extra pair of hands. You set the days and times you are free in our app, see visit offers near you, and accept only the ones you want. Visits are at least one hour, and many are two or three. Families who enjoy your visits can mark you as a favorite, so their next visits are offered to you first.\n\nWhat you will do\n- Keep an older adult company: conversation, cards and games, puzzles, walks, hobbies\n- Drive them to appointments, the salon, church, lunch out or a visit with friends\n- Run errands together or for them: groceries, the pharmacy, the post office\n- Help around the house with light tasks like tidying up, laundry or making a simple meal\n- Help with phones, tablets and video calls with family\n- Clock in and out in our app and leave a short note for the family after each visit\n\nWhat Neighbors never do\nNeighbors give everyday help only. You will never give personal or medical care: no bathing, dressing, grooming, help in the bathroom, feeding, lifting or transferring someone, wound care or medication. If a visit ever needs that, you let us know and we take it from there.\n\nPay\n- $18 an hour on weekdays\n- $21 an hour on evenings and weekends\n- Paid after every visit by direct deposit\n- 100% of the miles you drive during a visit (rides and errands), at the IRS rate of 76 cents a mile\n\nSchedule\nCompletely flexible. Work a few hours a week or a lot more. You choose your hours and the visits you take. Hours are not guaranteed, so this is a great fit if you want to set your own schedule.\n\nWhat you need\n- 21 or older\n- A valid driver\'s license and a reliable car insured in your name\n- A smartphone\n- A kind, patient, dependable nature and a love for older adults\n- Agreement to a criminal background check and driving record check (we pay for them up front)\n- No healthcare experience or license needed. Our short online course covers what you need.\n\nWho does well as a Neighbor\nRetirees, parents with school-day hours, college students, people between jobs, and anyone who wants meaningful part-time work close to home.\n\nHow to apply\n1. Apply online in about 5 minutes\n2. Pick a time for a friendly 20-minute video interview\n3. Finish a short online course and sign the Neighbor agreement\n4. Complete your background and driving record checks and add your bank account\n5. Start accepting visits near you\n\nNeighbors work as independent contractors and receive a 1099 at tax time.\n\nApply here: {link}' },

    }));
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
    a.download = 'show-me-neighbors-signups-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  }

  app.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t.dataset.tab) { tab = t.dataset.tab; return render(); }
    if (t.dataset.vf) { visF = t.dataset.vf; return renderVisits(); }
    if (t.id === 'rf') return load();
    if (t.id === 'csv') return csv();
    if (t.dataset.res) return interviewResult(t);
    if (t.dataset.ofc) return officeStep(t);
    if (t.dataset.resend) return resend(t);
    if (t.dataset.saveweek) {
      var wk = {}, bad = '';
      app.querySelectorAll('[data-week]').forEach(function (i) { var parts = i.value.split(',').map(function (x) { return x.replace(/\s/g, ''); }).filter(Boolean); parts.forEach(function (x) { if (!/^\d{1,2}:\d{2}-\d{1,2}:\d{2}$/.test(x)) bad = i.dataset.week + ': ' + x; }); if (parts.length) wk[i.dataset.week] = parts; });
      var el = document.getElementById('ss-interview_week');
      if (bad) { el.style.color = '#7a2a17'; el.textContent = 'Please write times like 10:00-12:00 (' + bad + ')'; return; }
      return saveSetting('interview_week', wk);
    }
  });
  async function interviewResult(t) {
    var n = nbrs.filter(function (x) { return x.id === t.dataset.id; })[0], res = t.dataset.res, name = (n.preferred || n.legal_first) + ' ' + n.legal_last;
    var what = { 'Passed': 'Mark ' + name + ' as Passed? They will get an email with their next steps.', 'Not a fit': 'Mark ' + name + ' as Not a fit? They will get a kind email saying we are not moving forward.', 'No-show': 'Mark ' + name + ' as a No-show? They will get an email to pick a new time' + ((n.no_shows || 0) >= 1 ? '. This is their second no-show, so their application will close.' : '.') }[res];
    if (t.dataset.sure !== '1') { app.querySelectorAll('[data-sure="1"]').forEach(function (b) { b.dataset.sure = ''; b.textContent = b.dataset.res; }); t.dataset.sure = '1'; t.textContent = 'Click again to confirm'; t.title = what; var tip = document.createElement('div'); tip.className = 'small muted'; tip.style.marginTop = '6px'; tip.textContent = what; t.parentNode.appendChild(tip); return; }
    t.disabled = true; t.textContent = 'Saving...';
    var notes = (document.querySelector('[data-nn="' + n.id + '"]') || {}).value || '';
    var r = await fn('result', { id: n.id, result: res, notes: notes });
    await loadApplicants();
    if (!r || !r.ok) return renderApplicants('<div class="msg err">' + e((r && r.error) || 'That did not save. Please try again.') + '</div>');
    renderApplicants('<div class="msg ' + (r.emailed ? 'ok' : 'err') + '">' + e(name) + ': ' + e(res) + '. ' + (r.emailed ? 'Their email was sent.' : 'The email did NOT send. See Emails.') + '</div>');
  }
  async function officeStep(t) {
    var n = nbrs.filter(function (x) { return x.id === t.dataset.id; })[0], name = (n.preferred || n.legal_first) + ' ' + n.legal_last, kind = t.dataset.ofc, val = t.dataset.val;
    var what = kind === 'approve' ? 'Approve ' + name + '? They get a welcome email and the Neighbor app.' : kind === 'checks' ? 'Mark ' + name + '\'s background and driving record checks as ' + val + '?' : (val === '1' ? 'Pause ' + name + '? They stop getting visit offers.' : 'Unpause ' + name + '?');
    if (t.dataset.sure !== '1') { app.querySelectorAll('[data-sure="1"]').forEach(function (b) { b.dataset.sure = ''; }); t.dataset.sure = '1'; t.dataset.label = t.textContent; t.textContent = 'Click again to confirm'; var tip = document.createElement('div'); tip.className = 'small muted'; tip.style.marginTop = '6px'; tip.textContent = what; t.parentNode.appendChild(tip); return; }
    t.disabled = true; t.textContent = 'Saving...';
    var body = { id: n.id };
    if (kind === 'checks') body.result = val;
    if (kind === 'pause') body.paused = val === '1';
    var r = await fn(kind, body);
    await loadApplicants();
    renderApplicants('<div class="msg ' + (r && r.ok ? 'ok' : 'err') + '">' + e(name) + ': ' + e(r && r.ok ? (kind === 'approve' ? (r.emailed ? 'approved, and their welcome email was sent.' : 'approved, but the welcome email did NOT send. See Emails.') : kind === 'checks' ? 'checks marked ' + val + '.' + (r.status === 'Ready for approval' ? ' They are now ready for approval.' : '') : (val === '1' ? 'paused.' : 'unpaused.')) : ((r && r.error) || 'That did not save.')) + '</div>');
  }
  async function resend(t) {
    t.disabled = true; t.textContent = 'Sending...';
    var r = await fn('resend', { id: t.dataset.resend });
    t.textContent = r && r.ok ? 'Sent' : 'Not sent. See Emails.';
  }
  app.addEventListener('change', async function (ev) {
    var t = ev.target;
    if (t.id === 'nf') { nStatus = t.value; return renderApplicants(); }
    if (t.dataset.set) { var x = sets.filter(function (y) { return y.key === t.dataset.set; })[0]; var v = t.type === 'checkbox' ? t.checked : (typeof x.value === 'number' ? +t.value : t.value.trim()); if (typeof v === 'number' && isNaN(v)) return; await saveSetting(t.dataset.set, v); if (t.type === 'checkbox') renderSettings(); return; }
    if (t.dataset.fn) {
      var rf = await sb.from('families').update({ notes: t.value.trim(), updated_at: new Date().toISOString(), updated_by: me }).eq('id', t.dataset.fn).select('id');
      var elf = document.getElementById('sv-' + t.dataset.fn); if (elf) { elf.style.color = rf.error || !rf.data.length ? '#7a2a17' : ''; elf.textContent = rf.error || !rf.data.length ? 'Not saved. Refresh and try again.' : 'Saved'; }
      return;
    }
    if (t.dataset.nn) {
      var r = await sb.from('neighbors').update({ notes: t.value.trim(), updated_at: new Date().toISOString(), updated_by: me }).eq('id', t.dataset.nn).select('id');
      var el = document.getElementById('sv-' + t.dataset.nn); if (el) { el.style.color = r.error || !r.data.length ? '#7a2a17' : ''; el.textContent = r.error || !r.data.length ? 'Not saved. Refresh and try again.' : 'Saved'; }
      nbrs.forEach(function (n) { if (n.id === t.dataset.nn) n.notes = t.value.trim(); });
      return;
    }
    if (t.id === 'af') { areaF = t.value; return render(); }
    if (t.id === 'sf') { statusF = t.value; return render(); }
    if (t.dataset.st) { if (await save(t.dataset.st, { status: t.value })) render(); return; }
    if (t.dataset.nt) save(t.dataset.nt, { notes: t.value.trim() });
  });
  sb.auth.onAuthStateChange(function (evt) { if (evt === 'SIGNED_IN' && !me) start(); });
  setInterval(function () { if (me && page !== 'settings' && document.visibilityState === 'visible' && !document.activeElement.matches('textarea, input, select')) load(); }, 60000);
  start();
})();
</script>
</body>
</html>
